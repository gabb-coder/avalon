<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Propose a team — too many picked</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#070B16}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <span class="icon-btn" aria-hidden="true"><span class="ic i-left" aria-hidden="true"></span></span>
    <span class="room-tag">ROOM KQVX</span>
    <span class="icon-btn" aria-hidden="true"><span class="ic i-history" aria-hidden="true"></span></span>
  </div>
  <div class="status is-alert" role="status">
    <div class="status-top"><span class="status-phase"><span class="ic i-standard ic-16" aria-hidden="true"></span>Quest 1 · Your team</span><span class="t-label b tnum" style="color: #F2A65A">3 of 2 picked</span></div>
    <p class="status-main">That's too many for Quest 1.</p>
    <p class="status-wait">Everyone is watching your picks appear live.</p>
  </div>

  <div class="content" style="gap: 10px; padding-top: 14px">
    <div class="row" style="justify-content: space-between">
      <p class="t-label muted b">Tap to add or remove</p>
      <p class="t-label faint">Quest 1 · 2 knights</p>
    </div>
    <div class="plist">
      <button class="prow is-selected" type="button" aria-pressed="true"><span class="av is-you">R</span><span class="prow-name"><span>Rowan</span><span class="prow-meta">You · leader</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow is-selected" type="button" aria-pressed="true"><span class="av">I</span><span class="prow-name"><span>Ilse</span><span class="prow-meta">On your team</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow is-selected" type="button" aria-pressed="true" style="box-shadow: inset 0 0 0 1.5px #F2A65A; background: rgba(242,166,90,.10)"><span class="av">T</span><span class="prow-name"><span>Tomas</span><span class="prow-meta" style="color: #F2A65A">Just added · one too many</span></span><span class="tick" style="background: #F2A65A"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">K</span><span class="prow-name"><span>Kofi</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">M</span><span class="prow-name"><span>Mei</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">S</span><span class="prow-name"><span>Sana</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">J</span><span class="prow-name"><span>Jude</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
    </div>
  </div>

  <div class="dock">
    <button class="btn btn-primary btn-block" type="button" disabled aria-describedby="many-why">Send team to the vote</button>
    <p class="btn-note" id="many-why" style="color: #F2A65A"><span class="ic i-warn ic-16" aria-hidden="true"></span>Quest 1 takes exactly 2. Remove 1.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
