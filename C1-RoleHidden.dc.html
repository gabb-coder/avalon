<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night — hold to reveal your role</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#070B16}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <a class="icon-btn" href="E4-Menu.dc.html" aria-label="Menu"><span class="ic i-menu" aria-hidden="true"></span></a>
    <span class="room-tag">ROOM KQVX</span>
    <span style="width: 48px"></span>
  </div>
  <div class="status is-you" role="status">
    <div class="status-top"><span class="status-phase"><span class="ic i-eyeoff ic-16" aria-hidden="true"></span>Night</span><span class="t-label faint tnum">0 of 7 ready</span></div>
    <p class="status-main">Your role is dealt. Only you can see it.</p>
    <p class="status-wait">Press and hold the card. Let go to hide it.</p>
  </div>

  <div class="content" style="align-items: center; justify-content: center; gap: 14px; padding-top: 14px">
    <button type="button" class="hold-card" aria-label="{{cardLabel}}" aria-pressed="{{held}}"
      onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" onContextMenu="{{noMenu}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}"
      style="appearance: none; border: 0; padding: 0; background: transparent; border-radius: 20px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none">
      <sc-if value="{{hidden}}" hint-placeholder-val="{{true}}">
        <div class="rcard rcard-back">
          <span class="ic i-logo" style="width: 112px; height: 112px; color: #D6B25E" aria-hidden="true"></span>
          <p class="d-m" style="letter-spacing: .1em; color: #F0D58C; font-size: 22px">AVALON</p>
          <span class="chip chip-gold anim-breathe" style="margin-top: 18px"><span class="ic i-hold" aria-hidden="true"></span>Press &amp; hold to reveal</span>
        </div>
      </sc-if>
      <sc-if value="{{held}}" hint-placeholder-val="{{false}}">
        <div class="rcard rcard-front good anim-flip">
          <span class="private"><span class="ic i-lock" aria-hidden="true"></span>Only you can see this</span>
          <span class="rcard-emblem"><span class="ic i-merlin ic-64" aria-hidden="true"></span></span>
          <p class="rcard-name">Merlin</p>
          <span class="team-tag good"><span class="ic i-good" aria-hidden="true"></span>Good</span>
          <p class="rcard-ability">You know who is Evil. Guide Good with hints: if the Assassin spots you at the end, Evil wins.</p>
          <div class="rcard-intel">
            <p class="rcard-intel-h">Evil you can see</p>
            <div class="intel-names"><span class="iname evil"><span class="mini">K</span>Kofi</span><span class="iname evil"><span class="mini">S</span>Sana</span></div>
            <p style="font-size: 13px; line-height: 1.35; color: #5A4A35">One Evil player is hidden from you (Mordred is in this game).</p>
          </div>
        </div>
      </sc-if>
    </button>
    <p class="t-label muted row" style="gap: 6px"><span class="ic i-eyeoff ic-16 gold" aria-hidden="true"></span>Tilt your phone away from your neighbours.</p>
  </div>

  <div class="dock">
    <sc-if value="{{seen}}" hint-placeholder-val="{{false}}">
      <a class="btn btn-primary btn-block" href="C3-NightWaiting.dc.html"><span class="ic i-check" aria-hidden="true"></span>I've seen my role</a>
    </sc-if>
    <sc-if value="{{notSeen}}" hint-placeholder-val="{{true}}">
      <button class="btn btn-primary btn-block" type="button" disabled aria-describedby="seen-why">I've seen my role</button>
      <p class="btn-note" id="seen-why"><span class="ic i-hold ic-16" aria-hidden="true"></span>Hold the card at least once first</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { held: false, seen: false }; }
  renderVals() {
    const s = this.state;
    const show = () => this.setState({ held: true, seen: true });
    const hide = () => { if (this.state.held) this.setState({ held: false }); };
    return {
      held: s.held, hidden: !s.held, seen: s.seen, notSeen: !s.seen,
      cardLabel: s.held ? 'Your role: Merlin, Good. Evil you can see: Kofi, Sana. Release to hide.' : 'Your role card, face down. Press and hold to reveal.',
      down: (e) => { try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} show(); },
      up: hide,
      noMenu: (e) => e.preventDefault(),
      keyDown: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); show(); } },
      keyUp: (e) => { if (e.key === ' ' || e.key === 'Enter') hide(); }
    };
  }
}
</script>
</body>
</html>
