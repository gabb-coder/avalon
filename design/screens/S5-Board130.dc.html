<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Propose at 130 percent text with long names</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#070B16}
</style>
</helmet>
<div class="phone sm" style="--ts: 1.3">
  <div class="topbar">
    <span class="icon-btn" aria-hidden="true"><span class="ic i-left" aria-hidden="true"></span></span>
    <span class="room-tag">ROOM KQVX</span>
    <span class="icon-btn" aria-hidden="true"><span class="ic i-history" aria-hidden="true"></span></span>
  </div>
  <div class="status is-you" role="status">
    <div class="status-top" style="flex-wrap: wrap"><span class="status-phase"><span class="ic i-standard ic-16" aria-hidden="true"></span>Quest 3 · Your team</span><span class="t-label b tnum gold">1 of 3</span></div>
    <p class="status-main">You lead Quest 3. Choose 3 knights you trust to carry it.</p>
  </div>

  <div class="content" style="gap: 8px; padding-top: 12px">
    <div class="plist">
      <button class="prow is-selected" type="button" aria-pressed="true"><span class="av is-you">B</span><span class="prow-name"><span>Bartholomew-Alex</span><span class="prow-meta">You · leader</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">M</span><span class="prow-name"><span>Maximilianovna</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">W</span><span class="prow-name"><span>Wolfgang Theodor</span><span class="prow-meta" style="color: #F2A65A">Offline · reconnecting</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">欧</span><span class="prow-name"><span>欧阳明月</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
      <button class="prow" type="button" aria-pressed="false"><span class="av">A</span><span class="prow-name"><span>Annemarie</span></span><span class="tick"><span class="ic i-check" aria-hidden="true"></span></span></button>
    </div>
  </div>

  <div class="dock">
    <button class="btn btn-primary btn-block" type="button" disabled>Send team to the vote</button>
    <p class="btn-note"><span class="ic i-info ic-16" aria-hidden="true"></span>Pick 2 more to continue</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":740}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
