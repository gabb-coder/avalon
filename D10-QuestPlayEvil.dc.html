<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest — play your card (Evil)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#070B16}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <span class="icon-btn" aria-hidden="true"><span class="ic i-menu" aria-hidden="true"></span></span>
    <span class="room-tag">ROOM KQVX</span>
    <span class="icon-btn" aria-hidden="true"><span class="ic i-history" aria-hidden="true"></span></span>
  </div>
  <div class="private-band" role="note"><span class="ic i-lock" aria-hidden="true"></span>Private · angle your phone away</div>
  <div class="status is-you" role="status" style="margin-top: 10px">
    <div class="status-top"><span class="status-phase"><span class="ic i-arrow ic-16" aria-hidden="true"></span>Quest 2 · On the quest</span><span class="t-label faint tnum">1 of 3 played</span></div>
    <p class="status-main">Choose your quest card</p>
    <div class="status-wait">Tomas, Mei and you are on Quest 2</div>
  </div>

  <div class="content" style="gap: 12px; padding-top: 14px; justify-content: flex-end">
    <div class="panel" style="display: flex; gap: 12px; align-items: flex-start; box-shadow: inset 0 0 0 1px rgba(240,112,127,.35)">
      <span class="ic i-evil evil" aria-hidden="true"></span>
      <p class="t-label muted"><b style="color:#F3EBDD">You may play either card.</b> One Fail sinks Quest 2. Only the count is shown, so a Fail can't be traced to you, unless you're the only suspect on the team.</p>
    </div>
  </div>

  <div class="dock" style="gap: 12px">
    <div class="qcards" role="radiogroup" aria-label="Your quest card">
      <button class="qcard qcard-success is-dim" type="button" role="radio" aria-checked="false"><span class="ic i-success" aria-hidden="true"></span>Success<span class="qcard-sub" style="color: #17636C">Help the quest</span></button>
      <button class="qcard qcard-fail is-picked" type="button" role="radio" aria-checked="true"><span class="ic i-fail" aria-hidden="true"></span>Fail<span class="qcard-sub" style="color: #FFE9EC">Sabotage it</span></button>
    </div>
    <button class="btn btn-danger btn-block" type="button"><span class="ic i-lock" aria-hidden="true"></span>Play Fail</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
